[package]
name = "crystal"
version = "0.1.0"
edition = "2024"
description = "Encrypted Markdown vault in a TUI"
license = "GPL-3.0-only"
readme = "README.md"
publish = false

[workspace]
members = ["crates/zalloc"]
# Plain `cargo test` / `cargo clippy` at the root check every crate.
default-members = [".", "crates/zalloc"]

[dependencies]
lexopt = "0.3.2"
rustix = { version = "1.1.5", features = ["event", "fs", "mm", "pipe", "process", "rand", "termios", "thread"] }
signal-hook = "0.4.5"
# Phase 2 (#4). Exact pins: crypto and the on-disk codec change only by review.
# age is the rage library. No default features: X25519 and scrypt are always
# built in; `plugin` (YubiKey/TPM, needs execve) waits for Phase 8.
age = { version = "=0.11.5", default-features = false }
# SecretBox for the vault identity; same version age-core re-exports.
secrecy = "=0.10.3"
# Zeroizing buffers and #[derive(ZeroizeOnDrop)] for plaintext.
zeroize = { version = "=1.9.1", features = ["derive"] }
# Vault and config codec. postcard's `alloc` also enables serde's `alloc`.
serde = { version = "=1.0.229", default-features = false, features = ["derive"] }
postcard = { version = "=1.1.3", default-features = false, features = ["alloc"] }
# Phase 3 (decision 0031). Exact pins: these see untrusted note text.
# Display width of a grapheme in terminal columns. No default features:
# the `cjk` tables (ambiguous-width characters as wide) are not used.
unicode-width = { version = "=0.2.3", default-features = false }
# Grapheme clusters, so a character with its combining marks or an emoji
# sequence fills one cell.
unicode-segmentation = "=1.13.3"
# CommonMark parser for the viewer (decision 0031). No default features:
# no getopts (its CLI) and no HTML writer; Crystal renders the events.
pulldown-cmark = { version = "=0.13.6", default-features = false }

[dev-dependencies]
# Round-trip property tests. No `fork`/`timeout`: they pull in rusty-fork
# and tempfile, which these pure in-memory tests do not need.
proptest = { version = "=1.12.0", default-features = false, features = ["std"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
overflow-checks = true
# Explicit: test-only code such as --crash-for-test is cfg(debug_assertions).
debug-assertions = false
# Keep unwinding so Drop impls (zeroizing) still run on panic.
panic = "unwind"

# Debug and test builds run the real scrypt work factor (log N 18, 256 MiB;
# docs/decisions/0027-scrypt-fixed.md); unoptimized, one passphrase file
# takes many seconds. Optimizing only the scrypt crates keeps Crystal's
# own code at opt-level 0 for debugging. No new dependency.
[profile.dev.package.scrypt]
opt-level = 3

[profile.dev.package.salsa20]
opt-level = 3

[profile.dev.package.pbkdf2]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3
