[package]
name = "crystal"
version = "0.1.0"
edition = "2024"
description = "Encrypted Markdown vault in a TUI"
license = "GPL-3.0-only"
readme = "README.md"
publish = false

[workspace]
members = ["crates/zalloc"]
# Plain `cargo test` / `cargo clippy` at the root check every crate.
default-members = [".", "crates/zalloc"]

[dependencies]
lexopt = "0.3.2"
rustix = { version = "1.1.5", features = ["event", "fs", "mm", "pipe", "process", "termios", "thread"] }
signal-hook = "0.4.5"

[profile.release]
lto = true
codegen-units = 1
strip = true
overflow-checks = true
# Explicit: test-only code such as --crash-for-test is cfg(debug_assertions).
debug-assertions = false
# Keep unwinding so Drop impls (zeroizing) still run on panic.
panic = "unwind"
