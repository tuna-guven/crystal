[package]
name = "crystal"
version = "0.1.0"
edition = "2024"
description = "Encrypted Markdown vault in a TUI"
license = "GPL-3.0-only"
readme = "README.md"
publish = false

[workspace]
members = ["crates/zalloc"]
# Plain `cargo test` / `cargo clippy` at the root check every crate.
default-members = [".", "crates/zalloc"]

[dependencies]
lexopt = "0.3.2"
rustix = { version = "1.1.5", features = ["event", "fs", "mm", "pipe", "process", "rand", "termios", "thread"] }
signal-hook = "0.4.5"
# Phase 2 (#4). Exact pins: crypto and the on-disk codec change only by review.
# age is the rage library. No default features: X25519 and scrypt are always
# built in; `plugin` (YubiKey/TPM, needs execve) waits for Phase 8.
age = { version = "=0.11.5", default-features = false }
# SecretBox for the vault identity; same version age-core re-exports.
secrecy = "=0.10.3"
# Zeroizing buffers and #[derive(ZeroizeOnDrop)] for plaintext.
zeroize = { version = "=1.9.1", features = ["derive"] }
# Vault and config codec. postcard's `alloc` also enables serde's `alloc`.
serde = { version = "=1.0.229", default-features = false, features = ["derive"] }
postcard = { version = "=1.1.3", default-features = false, features = ["alloc"] }

[dev-dependencies]
# Round-trip property tests. No `fork`/`timeout`: they pull in rusty-fork
# and tempfile, which these pure in-memory tests do not need.
proptest = { version = "=1.12.0", default-features = false, features = ["std"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
overflow-checks = true
# Explicit: test-only code such as --crash-for-test is cfg(debug_assertions).
debug-assertions = false
# Keep unwinding so Drop impls (zeroizing) still run on panic.
panic = "unwind"
