[package]
name = "crystal"
version = "0.1.0"
edition = "2024"
description = "Encrypted Markdown vault in a TUI"
license = "GPL-3.0-only"
readme = "README.md"
publish = false

[workspace]
members = ["crates/zalloc"]
# The fuzz crate is its own workspace with its own Cargo.lock: libfuzzer-sys
# never enters this lock file or the binary (docs/development/testing.md).
exclude = ["fuzz"]
# Plain `cargo test` / `cargo clippy` at the root check every crate.
default-members = [".", "crates/zalloc"]

[dependencies]
# The zeroizing global allocator: this workspace's own crate, the only one
# with `unsafe` code (docs/design/dependencies.md). No dependencies.
zalloc = { path = "crates/zalloc" }
lexopt = "0.3.2"
rustix = { version = "1.1.5", features = ["event", "fs", "mm", "pipe", "process", "rand", "termios", "thread"] }
signal-hook = "0.4.5"
# Phase 2 (#4). Exact pins: crypto and the on-disk codec change only by review.
# Crystal's own age v1 implementation (src/age_v1/, decision 0042) is built
# on these primitives (versions: decision 0051).
# Payload and stanza AEAD. No `getrandom` (rand_core/OsRng): randomness comes
# from rustix. `alloc` for the Vec-backed in-place buffers, as age enables it.
# `zeroize`: the cipher state wipes itself on drop, which 0.10 always did
# and 0.11 makes opt-in.
chacha20poly1305 = { version = "=0.11.0", default-features = false, features = ["alloc", "zeroize"] }
# Passphrase stanzas. No `simple`/`std`: no password-hash or rand_core.
scrypt = { version = "=0.12.0", default-features = false }
# X25519 stanzas. `static_secrets`: identity and ephemeral keys are built
# from 32 getrandom bytes (StaticSecret::from), so no rand_core RNG.
# `zeroize`: secrets wipe themselves on drop. `precomputed-tables`: faster
# public-key derivation, the default age uses.
x25519-dalek = { version = "=3.0.0", default-features = false, features = ["static_secrets", "zeroize", "precomputed-tables"] }
# HKDF-SHA-256 for the header MAC key, the payload key and the stanza keys.
hkdf = { version = "=0.13.0", default-features = false }
# HMAC-SHA-256 header MAC, checked in constant time (verify_slice).
hmac = { version = "=0.13.0", default-features = false }
sha2 = { version = "=0.11.1", default-features = false }
# Constant-time all-zero check on the X25519 shared secret, as age does.
subtle = { version = "=2.6.1", default-features = false }
# Zeroizing buffers and #[derive(ZeroizeOnDrop)] for plaintext.
zeroize = { version = "=1.9.2", features = ["derive"] }
# Vault and config codec. postcard's `alloc` also enables serde's `alloc`.
serde = { version = "=1.0.229", default-features = false, features = ["derive"] }
postcard = { version = "=1.1.3", default-features = false, features = ["alloc"] }
# Phase 3 (decision 0031). Exact pins: these see untrusted note text.
# Display width of a grapheme in terminal columns. No default features:
# the `cjk` tables (ambiguous-width characters as wide) are not used.
unicode-width = { version = "=0.2.3", default-features = false }
# Grapheme clusters, so a character with its combining marks or an emoji
# sequence fills one cell.
unicode-segmentation = "=1.13.3"
# CommonMark parser for the viewer (decision 0031). No default features:
# no getopts (its CLI) and no HTML writer; Crystal renders the events.
pulldown-cmark = { version = "=0.13.6", default-features = false }
# Phase 6 (decision 0059). Exact pins: these build the sandbox.
# Landlock up to ABI 9 in hard-requirement mode (decision 0010); the crate
# makes the raw Landlock syscalls, which would need `unsafe` here.
landlock = "=0.4.7"
# seccomp-bpf allowlist, built in pure Rust (no C libseccomp). No default
# features: no `json`, so no serde_json.
seccompiler = { version = "=0.5.0", default-features = false }
# x86_64 syscall and ioctl numbers for the seccomp allowlist, never typed by
# hand. Already in the tree (landlock, seccompiler, signal-hook); declaring
# it adds no crate. Constants only: calling into it would need `unsafe`.
libc = "=0.2.191"

[dev-dependencies]
# Round-trip property tests. No `fork`/`timeout`: they pull in rusty-fork
# and tempfile, which these pure in-memory tests do not need.
proptest = { version = "=1.12.0", default-features = false, features = ["std"] }
# Test-only (decision 0042): inflates the C2SP/CCTV age vectors that CCTV
# ships zlib-compressed, so tests/corpus/age-cctv/ holds them byte for byte
# as published. Pure Rust, forbid(unsafe_code); brings adler2. Only
# `with-alloc`, for decompress_to_vec_zlib_with_limit.
miniz_oxide = { version = "=0.8.9", default-features = false, features = ["with-alloc"] }

# cargo-fuzz builds the library with `--cfg fuzzing`, which compiles
# src/fuzz.rs (the fuzz targets' entry points, fuzz/). Declared so rustc
# knows the name; normal and release builds never set it.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
overflow-checks = true
# Explicit: test-only code such as --crash-for-test is cfg(debug_assertions).
debug-assertions = false
# Keep unwinding so Drop impls (zeroizing) still run on panic.
panic = "unwind"

# Debug builds of the binary, which the tests in tests/ run, use the real
# scrypt work factor (log N 20, 1 GiB; decision 0027; unit tests use log N
# 10); unoptimized, one passphrase file takes many seconds. Optimizing only the scrypt crates keeps Crystal's
# own code at opt-level 0 for debugging. No new dependency.
[profile.dev.package.scrypt]
opt-level = 3

[profile.dev.package.salsa20]
opt-level = 3

[profile.dev.package.pbkdf2]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3

# Every free wipes its block (crates/zalloc); unoptimized, that loop slows
# debug builds and tests by a fifth. Release builds are optimized anyway.
[profile.dev.package.zalloc]
opt-level = 3
