# Supply-chain policy (DESIGN.md threat A4). Run: cargo deny check

[graph]
# Only judge crates that end up in our binary.
targets = ["x86_64-unknown-linux-musl"]

[advisories]
yanked = "deny"

[licenses]
# GPL-3.0-compatible only. Add a license here only when a reviewed
# dependency needs it.
allow = ["MIT", "Apache-2.0"]
confidence-threshold = 0.93

[licenses.private]
# Our own unpublished crates (crystal, zalloc) are GPL-3.0; don't check them.
ignore = true

[bans]
multiple-versions = "deny"
wildcards = "deny"
allow-wildcard-paths = true
# DESIGN.md "Avoid" list, plus network/async crates (no network code at all).
deny = [
    { name = "tokio" },
    { name = "async-std" },
    { name = "smol" },
    { name = "reqwest" },
    { name = "hyper" },
    { name = "ureq" },
    { name = "openssl" },
    { name = "openssl-sys" },
    { name = "clap" },
    { name = "syntect" },
    { name = "tui-markdown" },
    { name = "rpassword" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
