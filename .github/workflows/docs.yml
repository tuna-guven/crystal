name: Docs

# Builds the book (book.toml, sources in docs/) on every push and pull
# request, so a broken SUMMARY.md or a missing chapter fails CI. Publishes
# it to GitHub Pages only from pushes to main.

on:
  push:
  pull_request:

# Read-only by default; only the deploy job gets Pages rights.
permissions:
  contents: read

# One deployment at a time; a newer push waits instead of cancelling a
# deployment halfway.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

env:
  # The official release binary, pinned by version and SHA-256 (checked
  # against GitHub's recorded asset digest and a local download). No
  # third-party installer action (docs/decisions/0017-mdbook-docs.md).
  MDBOOK_VERSION: 0.5.4
  MDBOOK_SHA256: 5222beabd3e37dc5be0d18ff99b79058469354db5c220153a1b92db5ba12be89

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Pinned by commit SHA (v7.0.1); tags can be moved, SHAs cannot.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install mdBook
        run: |
          archive="mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl --proto '=https' --tlsv1.2 -sSfL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/$archive"
          echo "${MDBOOK_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/mdbook"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/mdbook" mdbook
          echo "$RUNNER_TEMP/mdbook" >> "$GITHUB_PATH"

      - name: Build the book
        run: mdbook build

      # v6.0.0
      - name: Configure Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d

      # v5.0.0
      - name: Upload the book
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: target/book

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # v5.0.1
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
