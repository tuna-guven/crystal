name: CI

on:
  push:
  pull_request:

# Read-only token: no step can push, comment or create releases.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_DENY_VERSION: 0.20.2
  CARGO_AUDIT_VERSION: 0.22.2

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Pinned by commit SHA (v7.0.1); tags can be moved, SHAs cannot.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # Installs the exact toolchain, components and musl target
      # from rust-toolchain.toml.
      - name: Install toolchain
        run: rustup toolchain install

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      # Raise this shell's memlock limit to exactly the floor Crystal
      # requires (harden::MEMLOCK_FLOOR, docs/guide/setup.md), so the test locks
      # memory for real instead of only checking the refusal path.
      # Crystal is non-dumpable, so strace reads the bytes it writes only
      # with CAP_SYS_PTRACE, and the paths of its fds (-yy) only with
      # CAP_DAC_READ_SEARCH: a non-dumpable process's /proc/PID/fd belongs
      # to root, mode 0500. Crystal itself gets no capability (file
      # capabilities are not passed on across exec).
      - name: Install strace
        run: |
          sudo apt-get update
          sudo apt-get install --yes strace
          sudo setcap cap_sys_ptrace,cap_dac_read_search+ep "$(readlink -f "$(command -v strace)")"

      - name: Test
        run: |
          sudo prlimit --pid $$ --memlock=536870912:536870912
          # Fail here if the raise didn't apply; otherwise the test would
          # silently take its refusal branch and still pass.
          test "$(ulimit -l)" -eq 524288
          # The runner leaks open fds (142 and up) into every step; GitHub
          # treats this as by design (actions/runner-images#3391). Crystal
          # refuses to start with any inherited fd above 2 (docs/design/startup.md,
          # startup step 2), so close them here rather than weaken that
          # check. 255 is bash's own handle on this script (close-on-exec).
          for fd in $(ls /proc/$$/fd); do
            if [ "$fd" -gt 2 ] && [ "$fd" -ne 255 ]; then
              exec {fd}>&-
            fi
          done
          cargo test --locked
          # Phase 4 acceptance: strace shows only ciphertext written inside
          # the vault. Ignored in a plain run, since it needs strace with
          # CAP_SYS_PTRACE (installed above).
          cargo test --locked --test vault strace -- --ignored
          # The release binary too, at the same memlock floor: an optimized
          # build stretches passphrases far harder (scrypt), and only this
          # run shows whether that fits in locked memory
          # (docs/decisions/0027-scrypt-fixed.md). Tests that need a
          # debug-only hook are reported as ignored here.
          cargo test --release --locked

      - name: Install cargo-deny and cargo-audit
        run: |
          cargo install --locked cargo-deny --version "$CARGO_DENY_VERSION"
          cargo install --locked cargo-audit --version "$CARGO_AUDIT_VERSION"

      - name: cargo deny
        run: cargo deny check

      - name: cargo audit
        run: cargo audit

      - name: Release build
        run: cargo build --locked --release

      # Phase 0 acceptance: the binary must be static.
      - name: Check static binary
        run: |
          bin=target/x86_64-unknown-linux-musl/release/crystal
          file "$bin"
          file "$bin" | grep -q 'static-pie linked'
