name: CI

on:
  push:
  pull_request:

# Read-only token: no step can push, comment or create releases.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_DENY_VERSION: 0.20.2
  CARGO_AUDIT_VERSION: 0.22.2

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Pinned by commit SHA (v7.0.1); tags can be moved, SHAs cannot.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # Installs the exact toolchain, components and musl target
      # from rust-toolchain.toml.
      - name: Install toolchain
        run: rustup toolchain install

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      # Unit tests only (the library: src/, crates/zalloc). Every test that
      # starts the real binary (tests/*.rs: pty, vault, sandbox, the strace
      # check) needs Landlock ABI 9, which GitHub's runner kernel lacks,
      # and Crystal never runs without its full sandbox (decision 0010).
      # Those run locally before every commit (docs/development/testing.md).
      # The memlock limit is raised to Crystal's floor
      # (harden::MEMLOCK_FLOOR) anyway, so the floor's own unit test locks
      # memory for real.
      - name: Test
        run: |
          sudo prlimit --pid $$ --memlock=2147483648:2147483648
          # Fail here if the raise didn't apply.
          test "$(ulimit -l)" -eq 2097152
          cargo test --locked --workspace --lib
          # The release build too: optimized code, the same tests.
          cargo test --release --locked --workspace --lib

      - name: Install cargo-deny and cargo-audit
        run: |
          cargo install --locked cargo-deny --version "$CARGO_DENY_VERSION"
          cargo install --locked cargo-audit --version "$CARGO_AUDIT_VERSION"

      - name: cargo deny
        run: cargo deny check

      - name: cargo audit
        run: cargo audit

      - name: Release build
        run: cargo build --locked --release

      # Phase 0 acceptance: the binary must be static.
      - name: Check static binary
        run: |
          bin=target/x86_64-unknown-linux-musl/release/crystal
          file "$bin"
          file "$bin" | grep -q 'static-pie linked'
