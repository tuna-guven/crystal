name: Long property tests

# Weekly and on demand only: too slow for every push
# (docs/development/testing.md, "Property tests").
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

# Read-only token: no step can push, comment or create releases.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  long:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # Pinned by commit SHA (v7.0.1), as in ci.yml.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install toolchain
        run: rustup toolchain install

      # The same memlock floor and fd cleanup as ci.yml's Test step.
      - name: Long property tests
        run: |
          sudo prlimit --pid $$ --memlock=536870912:536870912
          test "$(ulimit -l)" -eq 524288
          for fd in $(ls /proc/$$/fd); do
            if [ "$fd" -gt 2 ] && [ "$fd" -ne 255 ]; then
              exec {fd}>&-
            fi
          done
          ./scripts/long-tests.sh
